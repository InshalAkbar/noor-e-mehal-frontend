<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Noor e Mehal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gold: #d4af37;
            --gold-light: #f0d77b;
            --gold-dark: #a88920;
            --black: #0a0a0a;
            --black-light: #111111;
            --gray: #888;
            --white: #ffffff;
            --border: rgba(212, 175, 55, 0.22);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--black);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* ===== GOLD GLOW BACKGROUND ===== */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.06) 0%, transparent 70%);
            top: -150px;
            right: -150px;
            border-radius: 50%;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.04) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            border-radius: 50%;
        }
        
        .container {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            padding: 40px 35px;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 40px rgba(212, 175, 55, 0.03);
            position: relative;
            z-index: 1;
        }
        
        /* ===== GOLD GLOW RING ===== */
        .container::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 26px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), transparent, rgba(212, 175, 55, 0.2));
            z-index: -1;
            opacity: 0.4;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo h1 {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 2px;
        }
        .logo h1 span { 
            color: var(--gold);
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }
        .logo p {
            color: var(--gray);
            font-size: 14px;
            margin-top: 5px;
            letter-spacing: 1px;
        }
        
        .gold-divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 15px auto 25px;
            border-radius: 10px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .form-group label .required {
            color: #f0d77b;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(212, 175, 55, 0.12);
            border-radius: 12px;
            color: var(--white);
            font-size: 14px;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.05);
            background: rgba(212, 175, 55, 0.04);
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255,255,255,0.2);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37, #a88920);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            background: linear-gradient(135deg, #f0d77b, #d4af37);
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.4);
        }
        .btn i {
            font-size: 18px;
        }
        
        .error {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: #f0d77b;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }
        .error i {
            margin-right: 8px;
        }
        
        .success {
            background: rgba(40, 167, 69, 0.12);
            border: 1px solid rgba(40, 167, 69, 0.2);
            color: #72d6a5;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }
        .success i {
            margin-right: 8px;
        }
        
        .login-link {
            text-align: center;
            margin-top: 18px;
            color: var(--gray);
            font-size: 14px;
        }
        .login-link a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        .login-link a:hover {
            color: var(--gold-light);
        }
        
        .back-link {
            text-align: center;
            margin-top: 12px;
        }
        .back-link a {
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .back-link a:hover {
            color: var(--gold);
        }
        .back-link a i {
            margin-right: 6px;
        }
        
        /* ===== FLOATING SHAPES ===== */
        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.02);
            animation: float 20s infinite;
        }
        .shape:nth-child(1) { width: 300px; height: 300px; top: -100px; right: -100px; animation-delay: 0s; }
        .shape:nth-child(2) { width: 200px; height: 200px; bottom: -50px; left: -50px; animation-delay: -5s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        
        @media (max-width: 480px) {
            .container { padding: 25px 20px; margin: 10px; }
            .logo h1 { font-size: 26px; }
        }
    </style>
</head>
<body data-page="register">
    <!-- ===== FLOATING SHAPES ===== -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    
    <div class="container">
        <div class="logo">
            <h1> Noor e <span>Mehal</span></h1>
            <p>Create your account to get started</p>
        </div>
        <div class="gold-divider"></div>
        
        <div class="error" id="formError" style="display:none"><i class="fas fa-exclamation-circle"></i> <span></span></div>
        <div class="success" id="formSuccess" style="display:none"><i class="fas fa-check-circle"></i> <span></span></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" name="full_name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <input type="password" name="password" placeholder="Min 6 characters" required>
            </div>
            <div class="form-group">
                <label>Confirm Password <span class="required">*</span></label>
                <input type="password" name="confirm_password" placeholder="Re-enter password" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="Enter your phone number">
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea name="address" placeholder="Enter your address"></textarea>
            </div>
            <button type="submit" class="btn"><i class="fas fa-user-plus"></i> Register</button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
        <div class="back-link">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>
<script src="js/main.js"></script>
</body>
</html>
