<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now - Noor-E-Mahal</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --gold: #d4af37; --gold-light: #f0d77b; --black: #0a0a0a; --white: #ffffff; --gray: #999999; }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: -1;
        }
        .booking-container {
            background: rgba(20,20,20,0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 24px;
            padding: 50px 45px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }
        .booking-container .icon {
            text-align: center;
            font-size: 48px;
            color: var(--gold);
            margin-bottom: 15px;
        }
        .booking-container h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            text-align: center;
            color: #fff;
            margin-bottom: 5px;
        }
        .booking-container h1 span { color: var(--gold); }
        .booking-container .subtitle {
            text-align: center;
            color: var(--gray);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .booking-container .product-info {
            background: rgba(212,175,55,0.08);
            border: 1px solid rgba(212,175,55,0.15);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .product-info .p-name {
            color: #fff;
            font-weight: 500;
            font-size: 16px;
        }
        .product-info .p-price {
            color: var(--gold);
            font-weight: 700;
            font-size: 18px;
            font-family: 'Playfair Display', serif;
        }
        .error-msg {
            background: rgba(255,0,0,0.1);
            border: 1px solid rgba(255,0,0,0.2);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #ccc;
            margin-bottom: 6px;
        }
        .form-group label .required {
            color: #ff6b6b;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212,175,55,0.15);
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .form-group select option {
            background: #1a1a1a;
            color: #fff;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37, #f0d77b);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(212,175,55,0.3);
        }
        .btn-submit i {
            margin-right: 10px;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: var(--gray);
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }
        .back-link a:hover {
            color: var(--gold);
        }
        @media (max-width: 600px) {
            .booking-container { padding: 30px 20px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body data-page="booking">
    <div class="booking-container">
        <div class="icon"><i class="fas fa-calendar-check"></i></div>
        <h1>Book Your <span>Wedding</span></h1>
        <p class="subtitle">Fill in the details to book your dream wedding package</p>

        <div class="error-msg" id="bkError" style="display:none"><i class="fas fa-exclamation-circle"></i> <span></span></div>

        <div class="product-info">
            <span class="p-name"><i class="fas fa-gift" style="color:var(--gold);margin-right:8px;"></i> <span id="bkName">Selected Package</span></span>
            <span class="p-price" id="bkPrice">Contact for Price</span>
        </div>

        <form id="bookingForm">
            <input type="hidden" name="product_id" value="">
            <input type="hidden" name="service_id" value="">
            <input type="hidden" name="product_name" value="">
            <input type="hidden" name="product_price" value="">

            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" name="full_name" value="" placeholder="Enter your full name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <input type="email" name="email" value="" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Phone <span class="required">*</span></label>
                    <input type="tel" name="phone" value="" placeholder="Enter phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label>Event Date <span class="required">*</span></label>
                <input type="date" name="event_date" value="" required>
            </div>

            <div class="form-group">
                <label>Number of Guests</label>
                <input type="number" name="guests" value="" placeholder="Estimated number of guests" min="1">
            </div>

            <div class="form-group">
                <label>Special Requests / Notes</label>
                <textarea name="notes" placeholder="Any special requests or notes for your wedding..."></textarea>
            </div>

            <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> Confirm Booking</button>
        </form>

        <div class="back-link">
            <a href="javascript:history.back()"><i class="fas fa-arrow-left"></i> Go Back</a>
        </div>
    </div>
<script src="js/data.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
